      - Button1:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(212, 4, 4, 1)
            BorderColor: =RGBA(135, 0, 0, 1)
            BorderThickness: =2
            Color: =RGBA(135, 0, 0, 1)
            Font: =FontWeight.Bold
            Height: =270
            Icon: ="Warning"
            Layout: =ButtonLayout.TextOnly
            OnSelect: |-
              =Set(
                  vPatientGender,
                  Index(
                      ["Male", "Female"],
                      RandBetween(1, 2)
                  ).Value
              );

              If(
                  vPatientGender = "Male",
                  Set(
                      vPatientName,
                      Index(
                          [
                              "Jack Thompson",
                              "Oliver Harris",
                              "Noah Wilson",
                              "William Parker",
                              "Thomas Mitchell",
                              "Lachlan Cooper",
                              "Henry Walker",
                              "Charlie Bennett"
                          ],
                          RandBetween(1, 8)
                      ).Value
                  ),
                  Set(
                      vPatientName,
                      Index(
                          [
                              "Charlotte Wilson",
                              "Olivia Harris",
                              "Amelia Parker",
                              "Mia Thompson",
                              "Isla Walker",
                              "Ava Mitchell",
                              "Matilda Cooper",
                              "Sophie Bennett"
                          ],
                          RandBetween(1, 8)
                      ).Value
                  )
              );

              Set(
                  vPatientAge,
                  RandBetween(18, 80)
              );

              Set(
                  vPatientLocation,
                  Index(
                      [
                          "Ascot Avenue, Zetland",
                          "George Street, Sydney CBD",
                          "City Road, Camperdown",
                          "Parramatta Road, Glebe",
                          "King Street, Newtown",
                          "Oxford Street, Darlinghurst",
                          "Cleveland Street, Redfern",
                          "Harris Street, Pyrmont",
                          "Anzac Parade, Kensington",
                          "Bourke Street, Surry Hills"
                      ],
                      RandBetween(1, 10)
                  ).Value
              );

              Set(
                  vAssignedResponder,
                  Index(
                      [
                          "Daniel Brooks",
                          "Sophie Turner",
                          "Ryan Mitchell",
                          "Emily Carter",
                          "Ben Walker",
                          "Grace Wilson",
                          "Liam Parker",
                          "Chloe Bennett"
                      ],
                      RandBetween(1, 8)
                  ).Value
              );

              Set(
                  vEstimatedTimeArrival,
                  RandBetween(1, 15)
              );

              Set(
                  vPatientRequest,
                  Patch(
                      PatientRequests,
                      Defaults(PatientRequests),
                      {
                          Title: "Patient Request",
                          PatientName: vPatientName,
                          PatientAge: vPatientAge,
                          PatientGender: {Value: vPatientGender},
                          LocationText: vPatientLocation,
                          MedicalCondition: txtPatientCondition.Text,
                          AssignedResponder: vAssignedResponder,
                          EstimatedTimeArrival: vEstimatedTimeArrival
                      }
                  )
              );

              Notify("Emergency request sent", NotificationType.Success);

              Navigate(RescueConfirmationScreen, ScreenTransition.Fade)
