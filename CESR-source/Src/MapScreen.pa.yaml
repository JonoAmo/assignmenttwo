Screens:
  MapScreen:
    Properties:
      OnVisible: |-
        =ClearCollect(
            mapLocation,
            {
                Name: "Your Location",
                Latitude: Location.Latitude,
                Longitude: Location.Longitude
            }
        )
    Children:
      - Map3:
          Control: Map@1.8.27
          Properties:
            BorderColor: =
            BorderRadius: =1
            CurrentLocation: =true
            DefaultLatitude: =Location.Latitude
            DefaultLongitude: =Location.Longitude
            DefaultZoomLevel: =15
            Height: =920
            Items: =mapLocation
            ItemsLabels: ="Name"
            ItemsLatitudes: ="Latitude"
            ItemsLongitudes: ="Longitude"
            Width: =632
            X: =4
            Y: =192
      - Rectangle3:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(125, 2, 2, 1)
            Height: =192
            Width: =640
      - Rectangle3_1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(125, 2, 2, 1)
            Height: =24
            Width: =640
            Y: =1112
      - Rectangle3_2:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(125, 2, 2, 1)
            Height: =1136
            Width: =4
      - Rectangle3_3:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(125, 2, 2, 1)
            Height: =1136
            Width: =4
            X: =636
      - Text6:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =RGBA(214, 221, 224, 1)
            Font: =FontWeight.Bold
            Height: =98
            Size: =45
            Text: ="Live Location"
            Width: =297
            X: =171
            Y: =71
      - Icon5:
          Control: ModernIcon@1.1.0
          Properties:
            Height: =62
            Icon: ="Home"
            IconColor: =RGBA(214, 221, 224, 1)
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
            Width: =70
            X: =17
            Y: =9
      - Icon6:
          Control: ModernIcon@1.1.0
          Properties:
            Height: =35 + (tmrPulse.Value / 100)
            Icon: ="Globe"
            IconColor: =RGBA(214, 221, 224, 1)
            Width: =35 + (tmrPulse.Value / 100)
            X: =136
            Y: =102
      - tmrPulse:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =1000
            Repeat: =true
            Visible: =false
            X: =40
            Y: =40
