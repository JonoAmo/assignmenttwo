      - Star1:
          Control: Star@2.4.0
          Variant: 5Points
          Properties:
            BorderColor: =If(userRating >= 1, RGBA(97, 2, 2, 1), RGBA(180, 180, 180, 1))
            Fill: =If(userRating >= 1, RGBA(97, 2, 2, 1), RGBA(180, 180, 180, 1))
            Height: =55
            OnSelect: |-
              =Set(userRating, 1);

              Set(
                  vPatientRequest,
                  Patch(
                      PatientRequests,
                      LookUp(PatientRequests, ID = vPatientRequest.ID),
                      {
                          ResponderRating: userRating
                      }
                  )
              );

              Notify("Rating saved", NotificationType.Success);

              Navigate(Thankscreen, ScreenTransition.Fade)
            Width: =55
            X: =134
            Y: =762
