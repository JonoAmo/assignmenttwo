      - Button3:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(8, 222, 8, 1)
            Height: =48
            Icon: ="Send"
            OnSelect: "=ClearCollect(\n    selectedEmergencyTypes,\n    If(chkMedicalEmergency.Checked, {Value: \"Medical emergency\"}),\n    If(chkInjury.Checked, {Value: \"Injury\"}),\n    If(chkFire.Checked, {Value: \"Fire\"}),\n    If(chkBreathingIssue.Checked, {Value: \"Breathing issue\"}),\n    If(chkSecurityThreat.Checked, {Value: \"Security threat\"}),\n    If(chkChestPain.Checked, {Value: \"Chest pain\"})\n);\n\nClearCollect(\n    selectedEmergencyTypes,\n    Filter(selectedEmergencyTypes, !IsBlank(Value))\n);\n\nIf(\n    CountRows(selectedEmergencyTypes) = 0,\n    Notify(\"Please select at least one emergency type.\", NotificationType.Error),\n\n    If(\n        IsBlank(txtPatientCondition.Text),\n        Notify(\"Please describe your medical condition.\", NotificationType.Error),\n\n        Set(\n            vPatientRequest,\n            Patch(\n                PatientRequests,\n                Defaults(PatientRequests),\n                {\n                    Title: \"Patient Request\",\n                    EmergencyType: selectedEmergencyTypes,\n                    MedicalCondition: txtPatientCondition.Text\n                }\n            )\n        );\n\n        Notify(\"Emergency information saved\", NotificationType.Success);\n\n        \n    )\n)"
            RadiusBottomLeft: =90
            RadiusBottomRight: =90
            RadiusTopLeft: =90
            RadiusTopRight: =90
            Text: ="Send"
            Width: =132
            X: =478
            Y: =946
